<script type="module">
import { preload, isReady, classifyAudioBuffer, classifyLiveChunk, ML_LABEL_TO_NAME } from './src/ml-classifier.js';

window.startMic = startMic;
window.startFile = startFile;
window.pickFile = pickFile;
window.toggleRec = toggleRec;
window.goHome = goHome;

const ML_NAMES = new Set(Object.values(ML_LABEL_TO_NAME));
const CHINESE_ONLY = new Set(['二胡','古筝','琵琶','大提琴','单簧管','萨克斯','风琴']);

const INSTRUMENTS=[
  {name:"钢琴",emoji:"🎹",color:"#ff6080",harmRatio:1.2,centroid:800,rolloff:2000,flatness:0.3,attack:0.02,zcr:0.1},
  {name:"小提琴",emoji:"🎻",color:"#ff8040",harmRatio:0.8,centroid:1500,rolloff:3500,flatness:0.15,attack:0.08,zcr:0.2},
  {name:"长笛",emoji:"🪈",color:"#40ff80",harmRatio:0.3,centroid:2000,rolloff:5000,flatness:0.2,attack:0.04,zcr:0.12},
  {name:"吉他",emoji:"🎸",color:"#80ff40",harmRatio:0.6,centroid:1200,rolloff:3000,flatness:0.25,attack:0.01,zcr:0.15},
  {name:"小号",emoji:"🎺",color:"#ffd040",harmRatio:1.5,centroid:1800,rolloff:4000,flatness:0.12,attack:0.03,zcr:0.08},
  {name:"大提琴",emoji:"🎻",color:"#ff6040",harmRatio:0.7,centroid:600,rolloff:1500,flatness:0.2,attack:0.1,zcr:0.18},
  {name:"单簧管",emoji:"🎵",color:"#4080ff",harmRatio:0.9,centroid:1200,rolloff:2800,flatness:0.18,attack:0.05,zcr:0.1},
  {name:"萨克斯",emoji:"🎷",color:"#ff8040",harmRatio:1.1,centroid:1400,rolloff:3200,flatness:0.15,attack:0.04,zcr:0.09},
  {name:"二胡",emoji:"🎻",color:"#c04040",harmRatio:0.4,centroid:1600,rolloff:3800,flatness:0.12,attack:0.06,zcr:0.22},
  {name:"古筝",emoji:"🎶",color:"#40ffc0",harmRatio:0.5,centroid:2200,rolloff:6000,flatness:0.08,attack:0.005,zcr:0.06},
  {name:"琵琶",emoji:"🎵",color:"#ff4080",harmRatio:0.35,centroid:1800,rolloff:4500,flatness:0.1,attack:0.008,zcr:0.13},
  {name:"风琴",emoji:"🎹",color:"#8040ff",harmRatio:1.0,centroid:1000,rolloff:2500,flatness:0.22,attack:0.06,zcr:0.07},
  {name:"鼓组",emoji:"🥁",color:"#808080",harmRatio:0.15,centroid:400,rolloff:1200,flatness:0.55,attack:0.002,zcr:0.35},
];

let aCtx,analyser,sourceNode,micStream,isRec=false,animId=null;
let inputMode="mic",fileAnalyzing=false,mediaElementConnected=false;
let confidences=INSTRUMENTS.map(()=>0);
let liveRing=null,liveRingWrite=0,liveMlBusy=false,lastLiveMl=0,lastMlUiUpdate=0;
let mlReady=false;
const canvas=document.getElementById("spectrum"),ctx=canvas.getContext("2d");
const fileInput=document.getElementById("file-input");
const LIVE_RING_SEC=3.5;

function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight}
window.addEventListener("resize",()=>{resize();if(isRec)renderSpectrum()});

async function ensureCtx(){
  if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(!analyser){
    analyser=aCtx.createAnalyser();
    analyser.fftSize=8192;
    analyser.smoothingTimeConstant=0.4;
  }
  if(aCtx.state==="suspended")await aCtx.resume();
}

function disconnectSource(){
  if(sourceNode){try{sourceNode.disconnect()}catch(_){}sourceNode=null}
}

function connectStream(stream){
  disconnectSource();
  sourceNode=aCtx.createMediaStreamSource(stream);
  sourceNode.connect(analyser);
}

function connectMediaElement(audioEl){
  disconnectSource();
  if(!mediaElementConnected){
    sourceNode=aCtx.createMediaElementSource(audioEl);
    mediaElementConnected=true;
  }
  sourceNode.connect(analyser);
}

function showApp(){
  document.getElementById("entry").style.display="none";
  document.getElementById("app").style.display="block";
  buildGrid();
  resize();
}

async function startMic(){
  try{
    await ensureCtx();
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    connectStream(micStream);
    inputMode="mic";
    showApp();
    document.getElementById("rec-btn").textContent="🎤 开始监听";
    document.getElementById("audio-player").style.display="none";
    hideReport();
  }catch(_){
    alert("无法访问麦克风，请检查权限或使用文件模式");
  }
}

async function startFile(){
  await ensureCtx();
  inputMode="file";
  pickFile();
}

function pickFile(){
  fileInput.value="";
  fileInput.click();
}

fileInput.onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  showApp();
  await analyzeFile(file);
};

function goHome(){
  isRec=false;
  if(animId)cancelAnimationFrame(animId);
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  disconnectSource();
  mediaElementConnected=false;
  confidences=INSTRUMENTS.map(()=>0);
  document.getElementById("app").style.display="none";
  document.getElementById("entry").style.display="block";
  hideReport();
}

function toggleRec(){
  if(inputMode==="file"&&fileAnalyzing)return;
  isRec=!isRec;
  const btn=document.getElementById("rec-btn");
  if(isRec){
    btn.textContent="⏹ 停止";
    btn.classList.add("active");
    resize();
    renderSpectrum();
  }else{
    btn.textContent=inputMode==="mic"?"🎤 开始监听":"▶ 播放分析";
    btn.classList.remove("active");
    if(animId)cancelAnimationFrame(animId);
  }
}

function hideReport(){
  document.getElementById("report").style.display="none";
  document.getElementById("yamnet-raw").style.display="none";
  document.getElementById("timeline").style.display="none";
  document.getElementById("timeline-label").style.display="none";
  document.getElementById("progress-wrap").style.display="none";
  document.getElementById("file-meta").textContent="";
}

function setProgress(pct,text){
  document.getElementById("progress-wrap").style.display="block";
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-text").textContent=text;
}

function hann(n,N){return 0.5*(1-Math.cos(2*Math.PI*n/(N-1)))}

function extractFeaturesFromSamples(samples,sampleRate){
  const N=4096;
  if(samples.length<N)return null;
  const mags=new Float32Array(N/2);
  for(let k=0;k<N/2;k++){
    let re=0,im=0;
    for(let n=0;n<N;n++){
      const w=hann(n,N);
      const angle=-2*Math.PI*k*n/N;
      re+=samples[n]*w*Math.cos(angle);
      im+=samples[n]*w*Math.sin(angle);
    }
    mags[k]=Math.sqrt(re*re+im*im);
  }
  let sumW=0,sumF=0;
  for(let i=0;i<N/2;i++){
    const f=i*sampleRate/N;
    sumW+=mags[i];
    sumF+=f*mags[i];
  }
  const centroid=sumW>0?sumF/sumW:500;
  let totalE=0;
  for(let i=0;i<N/2;i++)totalE+=mags[i]*mags[i];
  let cumE=0,rolloff=0;
  for(let i=0;i<N/2;i++){
    cumE+=mags[i]*mags[i];
    if(cumE>=totalE*0.85){rolloff=i*sampleRate/N;break}
  }
  let harmE=0,noiseE=0;
  const f0=Math.max(centroid*0.5,80);
  const binW=sampleRate/N;
  for(let h=1;h<=12;h++){
    const bin=Math.round(h*f0/binW);
    if(bin<N/2)harmE+=mags[bin]||0;
    const bw=Math.max(1,Math.round(f0*0.5/binW));
    for(let j=bin-bw;j<bin+bw;j++){
      if(j!==bin&&j>=0&&j<N/2)noiseE+=mags[j]||0;
    }
  }
  const harmRatio=noiseE>0?harmE/noiseE:1;
  let logSum=0,linSum=0;
  for(let i=0;i<N/2;i++){
    const v=mags[i]+1e-10;
    logSum+=Math.log(v);
    linSum+=v;
  }
  const flatness=linSum>0?Math.exp(logSum/(N/2))/(linSum/(N/2)):0.5;
  let zcr=0;
  for(let i=1;i<Math.min(samples.length,2048);i++){
    if(samples[i]*samples[i-1]<0)zcr++;
  }
  zcr/=Math.min(samples.length,2048);
  let rms=0;
  for(let i=0;i<samples.length;i++)rms+=samples[i]*samples[i];
  rms=Math.sqrt(rms/samples.length);
  return{centroid,rolloff,harmRatio,flatness,zcr,rms};
}

function getFeaturesLive(){
  const bufLen=analyser.fftSize/2;
  const freqData=new Float32Array(bufLen);
  analyser.getFloatFrequencyData(freqData);
  const timeData=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(timeData);
  const mags=[];
  for(let i=0;i<bufLen;i++)mags[i]=Math.pow(10,freqData[i]/20);
  let sumW=0,sumF=0;
  for(let i=0;i<bufLen;i++){
    const f=i*aCtx.sampleRate/analyser.fftSize;
    sumW+=mags[i];
    sumF+=f*mags[i];
  }
  const centroid=sumW>0?sumF/sumW:500;
  let totalE=0;
  for(let i=0;i<bufLen;i++)totalE+=mags[i]*mags[i];
  let cumE=0,rolloff=0;
  for(let i=0;i<bufLen;i++){
    cumE+=mags[i]*mags[i];
    if(cumE>=totalE*0.85){rolloff=i*aCtx.sampleRate/analyser.fftSize;break}
  }
  let harmE=0,noiseE=0;
  const f0=centroid*0.5;
  for(let h=1;h<=12;h++){
    const bin=Math.round(h*f0/(aCtx.sampleRate/analyser.fftSize));
    if(bin<bufLen)harmE+=mags[bin]||0;
    const bw=Math.round(f0*0.5/(aCtx.sampleRate/analyser.fftSize));
    for(let j=bin-bw;j<bin+bw;j++){
      if(j>bin&&j<bufLen)noiseE+=mags[j]||0;
    }
  }
  const harmRatio=noiseE>0?harmE/noiseE:1;
  let logSum=0,linSum=0;
  for(let i=0;i<bufLen;i++){
    const v=mags[i]+1e-10;
    logSum+=Math.log(v);
    linSum+=v;
  }
  const flatness=linSum>0?Math.exp(logSum/bufLen)/(linSum/bufLen):0.5;
  let zcr=0;
  for(let i=1;i<timeData.length;i++){
    if(timeData[i]*timeData[i-1]<0)zcr++;
  }
  zcr/=timeData.length;
  let rms=0;
  for(let i=0;i<timeData.length;i++)rms+=timeData[i]*timeData[i];
  rms=Math.sqrt(rms/timeData.length);
  return{centroid,rolloff,harmRatio,flatness,zcr,rms};
}

function matchInstrument(features){
  if(!features||features.rms<0.005)return null;
  let bestScore=0;
  const scores=[];
  for(const inst of INSTRUMENTS){
    const hSim=1-Math.min(Math.abs(Math.log(features.harmRatio)-Math.log(inst.harmRatio))/2,1);
    const cSim=1-Math.min(Math.abs(features.centroid-inst.centroid)/Math.max(inst.centroid,500),1);
    const rSim=1-Math.min(Math.abs(features.rolloff-inst.rolloff)/Math.max(inst.rolloff,1000),1);
    const fSim=1-Math.min(Math.abs(features.flatness-inst.flatness)/0.5,1);
    const zSim=1-Math.min(Math.abs(features.zcr-inst.zcr)/0.3,1);
    const score=hSim*0.3+cSim*0.22+rSim*0.18+fSim*0.18+zSim*0.12;
    scores.push(score);
    if(score>bestScore)bestScore=score;
  }
  for(let i=0;i<INSTRUMENTS.length;i++){
    confidences[i]=confidences[i]*0.85+scores[i]*0.15;
  }
  let maxC=0,maxIdx=0;
  for(let i=0;i<confidences.length;i++){
    if(confidences[i]>maxC){maxC=confidences[i];maxIdx=i}
  }
  return{inst:INSTRUMENTS[maxIdx],conf:maxC,scores};
}

function mergeScores(yamRanked,w2vRanked,spectralTotals){
  const specSum=spectralTotals.reduce((a,b)=>a+b,0)||1;
  const yamMap=Object.fromEntries((yamRanked||[]).map(r=>[r.name,r.pct]));
  const w2vMap=Object.fromEntries((w2vRanked||[]).map(r=>[r.name,r.pct]));
  const merged=INSTRUMENTS.map((inst,i)=>{
    const spec=spectralTotals[i]/specSum;
    const yam=yamMap[inst.name]||0;
    const w2v=w2vMap[inst.name]||0;
    let score;
    if(CHINESE_ONLY.has(inst.name))score=yam*0.20+w2v*0.08+spec*0.72;
    else if(ML_NAMES.has(inst.name))score=yam*0.40+w2v*0.28+spec*0.32;
    else score=yam*0.38+w2v*0.22+spec*0.40;
    return score;
  });
  const sum=merged.reduce((a,b)=>a+b,0)||1;
  return merged.map(v=>v/sum);
}

function runSpectralPass(data,sr,duration,onProgress){
  const winSec=0.5,hopSec=0.25;
  const win=Math.floor(sr*winSec);
  const hop=Math.floor(sr*hopSec);
  const segments=[];
  const totals=INSTRUMENTS.map(()=>0);
  for(let start=0;start+win<=data.length;start+=hop){
    const features=extractFeaturesFromSamples(data.subarray(start,start+win),sr);
    const match=matchInstrument(features);
    if(match&&match.conf>0.18){
      segments.push({t:start/sr,inst:match.inst,conf:match.conf});
      totals[INSTRUMENTS.indexOf(match.inst)]+=match.conf;
    }
    if(onProgress&&start%(hop*8)===0)onProgress(Math.min(40,(start/data.length)*40));
  }
  return{segments,totals,duration,hopSec};
}

async function analyzeFile(file){
  fileAnalyzing=true;
  inputMode="file";
  isRec=false;
  if(animId)cancelAnimationFrame(animId);
  hideReport();
  confidences=INSTRUMENTS.map(()=>0);
  document.getElementById("inst-name").textContent="分析中...";
  document.getElementById("inst-conf").textContent="📁 "+file.name;
  document.getElementById("rec-btn").textContent="分析中...";
  setProgress(0,"读取音频文件...");

  try{
    await ensureCtx();
    const buf=await file.arrayBuffer();
    const audioBuffer=await aCtx.decodeAudioData(buf.slice(0));
    const data=audioBuffer.getChannelData(0);
    const sr=audioBuffer.sampleRate;
    const duration=audioBuffer.duration;

    setProgress(5,"频谱指纹分析...");
    const spec=runSpectralPass(data,sr,duration,p=>setProgress(p,`频谱分析 ${(p/40*duration).toFixed(0)}s`));

    let mlResult={yamnet:{ranked:[],segments:[],rawTop:[],allClasses:[]},wav2vec:{ranked:[],segments:[]}};
    if(mlReady){
      mlResult=await classifyAudioBuffer(audioBuffer,{
        onProgress:(p,stage)=>setProgress(5+p*0.9,stage==="yamnet"?"YAMNet 521类推理...":"Wav2Vec2 推理..."),
      });
    }

    setProgress(98,"融合结果...");
    const merged=mergeScores(mlResult.yamnet.ranked,mlResult.wav2vec.ranked,spec.totals);
    const segments=mlResult.yamnet.segments.length?mlResult.yamnet.segments.map(s=>{
      const inst=INSTRUMENTS.find(x=>x.name===s.name)||INSTRUMENTS[0];
      return{t:s.t,inst,conf:s.score};
    }):spec.segments;

    showFileReport(file.name,duration,segments,merged,mlReady,mlResult.yamnet);
    setupFilePlayback(file,audioBuffer);
  }catch(err){
    document.getElementById("inst-conf").textContent="❌ 无法解析此音频";
    document.getElementById("inst-name").textContent=err.message||"格式不支持";
  }finally{
    fileAnalyzing=false;
    document.getElementById("progress-wrap").style.display="none";
    document.getElementById("rec-btn").textContent="▶ 播放分析";
  }
}

function showFileReport(name,duration,segments,mergedPcts,usedMl,yamnetData){
  const ranked=INSTRUMENTS.map((inst,i)=>({inst,pct:mergedPcts[i]}))
    .filter(x=>x.pct>0.02)
    .sort((a,b)=>b.pct-a.pct);

  if(ranked.length===0){
    document.getElementById("inst-conf").textContent="未检测到明显乐器信号";
    document.getElementById("inst-name").textContent="--";
    return;
  }

  const top=ranked[0];
  document.getElementById("inst-name").textContent=top.inst.emoji+" "+top.inst.name;
  document.getElementById("inst-conf").textContent=`主奏乐器 · 占比 ${(top.pct*100).toFixed(0)}%`;
  document.getElementById("inst-color").style.background=top.inst.color;
  document.getElementById("inst-color").style.width=(top.pct*100)+"%";
  const mode=usedMl?"YAMNet+Wav2Vec2+频谱":"频谱指纹";
  document.getElementById("file-meta").textContent=`${name} · ${duration.toFixed(1)}s · ${mode} · ${segments.length} 片段`;

  ranked.forEach(r=>{confidences[INSTRUMENTS.indexOf(r.inst)]=r.pct});

  const report=document.getElementById("report");
  report.style.display="block";
  report.innerHTML=`<h3>乐器占比 · 三模型融合</h3>`+ranked.map(r=>`
    <div class="report-row">
      <span class="emoji">${r.inst.emoji}</span>
      <span class="label">${r.inst.name}</span>
      <div class="report-bar"><span style="width:${(r.pct*100).toFixed(0)}%;background:${r.inst.color}"></span></div>
      <span class="pct">${(r.pct*100).toFixed(0)}%</span>
    </div>`).join("");

  if(yamnetData&&yamnetData.allClasses&&yamnetData.allClasses.length){
    const raw=document.getElementById("yamnet-raw");
    raw.style.display="block";
    const topRaw=yamnetData.allClasses.slice(0,12);
    const rest=yamnetData.allClasses.slice(12);
    const row=c=>`<div class="raw-row"><span class="raw-name">#${c.index} ${c.name}</span><span class="raw-score">${(c.score*100).toFixed(1)}%</span></div>`;
    raw.innerHTML=`<h3>YAMNet AudioSet · Top ${topRaw.length} / 521 类</h3>`+
      topRaw.map(row).join("")+
      (rest.length?`<details style="margin-top:8px"><summary style="font-size:10px;color:#505050;cursor:pointer">展开全部 ${yamnetData.allClasses.length} 个命中类别</summary>${rest.map(row).join("")}</details>`:"");
  }

  if(segments.length>1){
    const tl=document.getElementById("timeline");
    const segHop=usedMl?0.48:0.25;
    document.getElementById("timeline-label").style.display="block";
    tl.style.display="flex";
    tl.innerHTML="";
    segments.forEach(seg=>{
      const w=Math.max(2,(segHop/duration)*100);
      const el=document.createElement("div");
      el.style.cssText=`flex:0 0 ${w}%;height:100%;background:${seg.inst.color};opacity:${0.35+seg.conf*0.65}`;
      el.title=`${seg.t.toFixed(1)}s ${seg.inst.name}`;
      tl.appendChild(el);
    });
  }

  const tops=ranked.slice(0,3).map(r=>INSTRUMENTS.indexOf(r.inst));
  updateGrid(tops);
}

const hopSec=0.25;

function setupFilePlayback(file,audioBuffer){
  const audio=document.getElementById("audio-player");
  audio.src=URL.createObjectURL(file);
  audio.style.display="block";
  mediaElementConnected=false;
  connectMediaElement(audio);
  audio.onplay=()=>{
    if(!isRec){isRec=true;document.getElementById("rec-btn").textContent="⏹ 停止";renderSpectrum()}
  };
  audio.onended=()=>{
    isRec=false;
    document.getElementById("rec-btn").textContent="▶ 播放分析";
    if(animId)cancelAnimationFrame(animId);
  };
}

function pushLiveRing(timeData){
  if(!liveRing){
    liveRing=new Float32Array(Math.floor(aCtx.sampleRate*LIVE_RING_SEC));
    liveRingWrite=0;
  }
  for(let i=0;i<timeData.length;i++){
    liveRing[liveRingWrite]=timeData[i];
    liveRingWrite=(liveRingWrite+1)%liveRing.length;
  }
}

function getLiveRingOrdered(){
  if(!liveRing)return null;
  const out=new Float32Array(liveRing.length);
  let j=0;
  for(let i=liveRingWrite;i<liveRing.length;i++)out[j++]=liveRing[i];
  for(let i=0;i<liveRingWrite;i++)out[j++]=liveRing[i];
  return out;
}

async function runLiveMl(){
  if(!mlReady||liveMlBusy||inputMode!=="mic"||!isRec)return;
  const now=performance.now();
  if(now-lastLiveMl<2000)return;
  lastLiveMl=now;
  const samples=getLiveRingOrdered();
  if(!samples)return;
  liveMlBusy=true;
  try{
    const {yamnet,wav2vec}=await classifyLiveChunk(samples,aCtx.sampleRate);
    let name=null,score=0,source="";
    if(yamnet?.instruments?.[0]&&yamnet.instruments[0].pct>0.2){
      name=yamnet.instruments[0].name;
      score=yamnet.instruments[0].pct;
      source="YAMNet";
    }
    if(wav2vec?.[0]){
      const w2vName=ML_LABEL_TO_NAME[wav2vec[0].label];
      if(w2vName&&wav2vec[0].score>score*0.9){name=w2vName;score=wav2vec[0].score;source="Wav2Vec2"}
    }
    const inst=INSTRUMENTS.find(x=>x.name===name);
    if(inst&&score>0.2){
      document.getElementById("inst-name").textContent=inst.emoji+" "+inst.name;
      document.getElementById("inst-conf").textContent=`${source} ${(score*100).toFixed(0)}%`;
      document.getElementById("inst-color").style.background=inst.color;
      document.getElementById("inst-color").style.width=(score*100)+"%";
      lastMlUiUpdate=performance.now();
      if(yamnet?.instruments)yamnet.instruments.forEach(r=>{
        const idx=INSTRUMENTS.findIndex(x=>x.name===r.name);
        if(idx>=0)confidences[idx]=confidences[idx]*0.5+r.pct*0.5;
      });
    }
  }finally{liveMlBusy=false}
}

function renderSpectrum(){
  if(!isRec||!analyser)return;
  const bufLen=analyser.frequencyBinCount;
  const freqData=new Uint8Array(bufLen);
  analyser.getByteFrequencyData(freqData);
  const timeData=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(timeData);
  if(inputMode==="mic")pushLiveRing(timeData);
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const bw=W/bufLen;
  const features=getFeaturesLive();
  const match=matchInstrument(features);
  if(inputMode==="mic"&&!liveMlBusy)runLiveMl();
  for(let i=0;i<bufLen;i++){
    const x=i*bw,h=freqData[i]/255*H*0.8;
    const freq=i*aCtx.sampleRate/analyser.fftSize;
    const hue=(freq/2000)*300%360;
    ctx.fillStyle=`hsla(${hue},70%,50%,0.7)`;
    ctx.fillRect(x,H-h,bw,h);
  }
  if(match&&match.conf>0.3){
    const inst=match.inst;
    const startF=Math.max(0,inst.centroid-400);
    const endF=inst.rolloff;
    const sx=(startF/(aCtx.sampleRate/2))*W;
    const ex=(endF/(aCtx.sampleRate/2))*W;
    ctx.fillStyle=inst.color+"22";
    ctx.fillRect(sx,0,ex-sx,H);
    ctx.strokeStyle=inst.color+"88";
    ctx.lineWidth=2;
    ctx.strokeRect(sx,0,ex-sx,H);
  }
  updateUI(match);
  animId=requestAnimationFrame(renderSpectrum);
}

function updateUI(match){
  if(!match||match.conf<0.2){
    if(!fileAnalyzing){
      document.getElementById("inst-name").textContent="--";
      document.getElementById("inst-conf").textContent="🎵 等待音频...";
      document.getElementById("inst-color").style.width="0";
    }
    updateGrid([]);
    return;
  }
  if(inputMode==="mic"&&(!mlReady||performance.now()-lastMlUiUpdate>2500)){
    const inst=match.inst;
    document.getElementById("inst-name").textContent=inst.emoji+" "+inst.name;
    document.getElementById("inst-conf").textContent=`频谱 ${(match.conf*100).toFixed(0)}%${mlReady?" · AI 同步中":""}`;
    document.getElementById("inst-color").style.background=inst.color;
    document.getElementById("inst-color").style.width=(match.conf*100)+"%";
  }
  const tops=match.scores.map((s,i)=>({idx:i,score:s})).sort((a,b)=>b.score-a.score).slice(0,3).map(s=>s.idx);
  updateGrid(tops);
}

function updateGrid(tops){
  document.querySelectorAll(".inst-card").forEach((c,i)=>{
    c.classList.toggle("active",tops.includes(i));
    if(tops.includes(i))c.style.setProperty("--glow",INSTRUMENTS[i].color+"66");
    const bar=c.querySelector(".bar");
    if(bar){
      bar.style.width=(confidences[i]*100)+"%";
      bar.style.background=INSTRUMENTS[i].color;
    }
  });
}

function buildGrid(){
  const grid=document.getElementById("inst-grid");
  grid.innerHTML="";
  INSTRUMENTS.forEach(inst=>{
    const card=document.createElement("div");
    card.className="inst-card";
    card.innerHTML=`<span class="emoji">${inst.emoji}</span><span class="name">${inst.name}</span><div class="bar" style="width:0;background:${inst.color}"></div>`;
    grid.appendChild(card);
  });
}

function setModelStatus(state,detail){
  const el=document.getElementById("model-status");
  const labels={yamnet:"YAMNet",yamnet_model:"YAMNet 模型","yamnet-model":"YAMNet 模型",wav2vec2:"Wav2Vec2",done:"完成"};
  const stageLabel=labels[detail]||detail||"";
  if(state==="loading")el.innerHTML=`<span class="badge loading">⏳ 加载 ${stageLabel} ${typeof detail==="number"?detail+"%":""}</span><div style="margin-top:6px;font-size:10px;color:#404040">YAMNet ~15MB + Wav2Vec2 ~90MB，首次需联网</div>`;
  else if(state==="ready")el.innerHTML=`<span class="badge ready">✅ YAMNet 521类 + Wav2Vec2 就绪</span>`;
  else el.innerHTML=`<span class="badge error">⚠ AI 部分不可用，将降级频谱识别</span><div style="font-size:10px;color:#404040;margin-top:4px">${detail||""}</div>`;
}

function enableEntry(){
  document.getElementById("btn-mic").disabled=false;
  document.getElementById("btn-file").disabled=false;
}

preload((pct,stage)=>setModelStatus("loading",`${stage||"模型"} ${pct}%`)).then(()=>{
  mlReady=isReady();
  setModelStatus("ready");
  enableEntry();
}).catch(err=>{
  mlReady=false;
  setModelStatus("error",err.message);
  enableEntry();
});

resize();
</script>
