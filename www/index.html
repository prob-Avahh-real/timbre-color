<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>赏曲辨色 · Timbre & Color</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#d0d0d0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow-y:auto}
#app{max-width:560px;margin:0 auto;padding:14px;min-height:100vh}
h1{text-align:center;font-size:26px;font-weight:900;background:linear-gradient(135deg,#ff6080,#ffa040,#40ff80,#4080ff,#c040ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.sub{text-align:center;font-size:11px;color:#404040;margin-bottom:14px}
/* Spectrum canvas */
#spectrum{width:100%;height:160px;border-radius:10px;background:#0a0a0f;border:1px solid#1a1a20;margin-bottom:10px}
/* Detected instrument */
#detected{text-align:center;padding:14px;background:#0f0f15;border:1px solid#1a1a20;border-radius:10px;margin-bottom:10px;min-height:80px}
#inst-name{font-size:28px;font-weight:900;margin:4px 0}
#inst-conf{font-size:13px;color:#606060;margin-bottom:2px}
#inst-color{width:60px;height:6px;border-radius:3px;margin:6px auto}
/* Instrument list */
.instruments{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inst-card{background:#0f0f15;border:1px solid#1a1a20;border-radius:8px;padding:8px;text-align:center;transition:all.3s}
.inst-card.active{border-color:#fff;transform:scale(1.03);box-shadow:0 0 20px var(--glow)}
.inst-card .emoji{font-size:22px;display:block;margin-bottom:2px}
.inst-card .name{font-size:10px;color:#808080}
.inst-card .bar{height:3px;border-radius:2px;margin-top:3px;transition:width.3s}
/* Controls */
.controls{display:flex;gap:6px;margin:10px 0}
.btn{padding:8px 16px;border-radius:8px;border:1px solid#202020;background:#0f0f15;color:#a0a0a0;font-size:12px;cursor:pointer;flex:1;text-align:center}
.btn.active{background:#1a1020;border-color:#604080;color:#c080e0}
.btn:active{transform:scale(.96)}
/* Mic prompt */
#mic-prompt{text-align:center;padding:30px;color:#404040}
#mic-prompt button{background:linear-gradient(135deg,#604080,#402060);border:none;color:#e0d0f0;padding:10px 24px;border-radius:20px;font-size:14px;cursor:pointer;margin-top:10px}
@media(max-width:400px){.instruments{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="mic-prompt"><div>🎤</div><div style="margin-top:8px">需要麦克风分析乐器音色</div><button onclick="reqMic()">允许麦克风</button></div>
<div id="app" style="display:none">
<h1>赏曲辨色</h1><p class="sub">—— 纯音乐 · 乐器音色实时识别 ——</p>
<canvas id="spectrum"></canvas>
<div id="detected"><div id="inst-conf">🎵 等待演奏...</div><div id="inst-name">--</div><div id="inst-color"></div></div>
<div class="controls">
  <button class="btn active" onclick="toggleRec()" id="rec-btn">🎤 开始监听</button>
  <button class="btn" onclick="setSource('mic')">🎙 麦克风</button>
  <button class="btn" onclick="setSource('file')">📁 文件</button>
</div>
<div class="instruments" id="inst-grid"></div>
</div>
<audio id="audio-player" controls style="display:none;width:100%;margin-top:8px"></audio>
<script>
// ==================== INSTRUMENT PROFILES ====================
const INSTRUMENTS=[
  {name:"钢琴",emoji:"🎹",color:"#ff6080",harmRatio:1.2,centroid:800,rolloff:2000,flatness:0.3,attack:0.02,zcr:0.1},
  {name:"小提琴",emoji:"🎻",color:"#ff8040",harmRatio:0.8,centroid:1500,rolloff:3500,flatness:0.15,attack:0.08,zcr:0.2},
  {name:"长笛",emoji:"🪈",color:"#40ff80",harmRatio:0.3,centroid:2000,rolloff:5000,flatness:0.2,attack:0.04,zcr:0.12},
  {name:"吉他",emoji:"🎸",color:"#80ff40",harmRatio:0.6,centroid:1200,rolloff:3000,flatness:0.25,attack:0.01,zcr:0.15},
  {name:"小号",emoji:"🎺",color:"#ffd040",harmRatio:1.5,centroid:1800,rolloff:4000,flatness:0.12,attack:0.03,zcr:0.08},
  {name:"大提琴",emoji:"🎻",color:"#ff6040",harmRatio:0.7,centroid:600,rolloff:1500,flatness:0.2,attack:0.1,zcr:0.18},
  {name:"单簧管",emoji:"🎵",color:"#4080ff",harmRatio:0.9,centroid:1200,rolloff:2800,flatness:0.18,attack:0.05,zcr:0.1},
  {name:"萨克斯",emoji:"🎷",color:"#ff8040",harmRatio:1.1,centroid:1400,rolloff:3200,flatness:0.15,attack:0.04,zcr:0.09},
  {name:"二胡",emoji:"🎻",color:"#c04040",harmRatio:0.4,centroid:1600,rolloff:3800,flatness:0.12,attack:0.06,zcr:0.22},
  {name:"古筝",emoji:"🎶",color:"#40ffc0",harmRatio:0.5,centroid:2200,rolloff:6000,flatness:0.08,attack:0.005,zcr:0.06},
  {name:"琵琶",emoji:"🎵",color:"#ff4080",harmRatio:0.35,centroid:1800,rolloff:4500,flatness:0.1,attack:0.008,zcr:0.13},
  {name:"风琴",emoji:"🎹",color:"#8040ff",harmRatio:1.0,centroid:1000,rolloff:2500,flatness:0.22,attack:0.06,zcr:0.07},
];

// ==================== AUDIO ENGINE ====================
let aCtx,analyser,micStream,isRec=false,animId=null,audioSource="mic";
const canvas=document.getElementById("spectrum"),ctx=canvas.getContext("2d");
function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight}
window.addEventListener("resize",()=>{resize();if(isRec)renderSpectrum()});

async function reqMic(){try{aCtx=new(window.AudioContext||window.webkitAudioContext)();
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});setupAudio(micStream);
  document.getElementById("mic-prompt").style.display="none";document.getElementById("app").style.display="block";
  buildGrid()}catch(e){document.getElementById("mic-prompt").innerHTML='<div>❌</div><div>麦克风不可用</div><button onclick="reqMic()">重试</button>'}}

function setupAudio(stream){analyser=aCtx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.4;
  const src=aCtx.createMediaStreamSource(stream);src.connect(analyser)}
function setSource(s){audioSource=s;document.querySelectorAll(".controls .btn").forEach((b,i)=>{if(i>=1)b.classList.toggle("active",i===1&&s==="mic"||i===2&&s==="file")});
  if(s==="file"){const inp=document.createElement("input");inp.type="file";inp.accept="audio/*";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;
    const url=URL.createObjectURL(f);const audio=document.getElementById("audio-player");audio.src=url;audio.style.display="block";audio.play();
    const stream=aCtx.createMediaElementSource(audio);setupAudio(stream);audio.onended=()=>{if(isRec)renderSpectrum()}};inp.click()}}

function toggleRec(){isRec=!isRec;const btn=document.getElementById("rec-btn");
  if(isRec){btn.textContent="⏹ 停止";btn.classList.add("active");resize();renderSpectrum()}
  else{btn.textContent="🎤 开始监听";btn.classList.remove("active");if(animId)cancelAnimationFrame(animId)}}

// ==================== SPECTRAL ANALYSIS ====================
function getFeatures(){
  const bufLen=analyser.fftSize/2;const freqData=new Float32Array(bufLen);analyser.getFloatFrequencyData(freqData);
  const timeData=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(timeData);
  // Convert dB to linear magnitude
  const mags=[];for(let i=0;i<bufLen;i++)mags[i]=Math.pow(10,freqData[i]/20);
  // Spectral centroid
  let sumW=0,sumF=0;for(let i=0;i<bufLen;i++){const f=i*aCtx.sampleRate/analyser.fftSize;sumW+=mags[i];sumF+=f*mags[i]}
  const centroid=sumW>0?sumF/sumW:500;
  // Spectral rolloff (85% energy)
  let totalE=0;for(let i=0;i<bufLen;i++)totalE+=mags[i]*mags[i];let cumE=0,rolloff=0;
  for(let i=0;i<bufLen;i++){cumE+=mags[i]*mags[i];if(cumE>=totalE*.85){rolloff=i*aCtx.sampleRate/analyser.fftSize;break}}
  // Harmonic ratio: compare peaks at harmonic positions
  let harmE=0,noiseE=0;const f0=centroid*.5; // estimate fundamental
  for(let h=1;h<=12;h++){const bin=Math.round(h*f0/(aCtx.sampleRate/analyser.fftSize));if(bin<bufLen){harmE+=mags[bin]||0}
    const bw=Math.round(f0*.5/(aCtx.sampleRate/analyser.fftSize));for(let j=bin-bw;j<bin+bw;j++){if(j>bin&&j<bufLen)noiseE+=mags[j]||0}}
  const harmRatio=noiseE>0?harmE/noiseE:1;
  // Spectral flatness
  let logSum=0,linSum=0;for(let i=0;i<bufLen;i++){const v=mags[i]+1e-10;logSum+=Math.log(v);linSum+=v}
  const flatness=linSum>0?Math.exp(logSum/bufLen)/(linSum/bufLen):.5;
  // Zero crossing rate
  let zcr=0;for(let i=1;i<timeData.length;i++){if(timeData[i]*timeData[i-1]<0)zcr++}zcr/=timeData.length;
  // RMS
  let rms=0;for(let i=0;i<timeData.length;i++)rms+=timeData[i]*timeData[i];rms=Math.sqrt(rms/timeData.length);
  return{centroid,rolloff,harmRatio,flatness,zcr,rms}
}

// ==================== MATCHING ====================
let confidences=INSTRUMENTS.map(()=>0);
function matchInstrument(features){
  if(features.rms<.005)return; // silence
  let best=null,bestScore=0;const scores=[];
  for(const inst of INSTRUMENTS){
    // Multi-feature scoring
    let score=0;
    // Harmonic ratio similarity
    const hSim=1-Math.min(Math.abs(Math.log(features.harmRatio)-Math.log(inst.harmRatio))/2,1);
    // Centroid similarity
    const cSim=1-Math.min(Math.abs(features.centroid-inst.centroid)/Math.max(inst.centroid,500),1);
    // Rolloff similarity
    const rSim=1-Math.min(Math.abs(features.rolloff-inst.rolloff)/Math.max(inst.rolloff,1000),1);
    // Flatness similarity
    const fSim=1-Math.min(Math.abs(features.flatness-inst.flatness)/.5,1);
    // Weighted combination
    score=hSim*.35+cSim*.25+rSim*.2+fSim*.2;
    scores.push(score);
    if(score>bestScore){bestScore=score;best=inst}
  }
  // Update confidences with smoothing
  for(let i=0;i<INSTRUMENTS.length;i++){confidences[i]=confidences[i]*.85+scores[i]*.15}
  // Find current best
  let maxC=0,maxIdx=0;for(let i=0;i<confidences.length;i++){if(confidences[i]>maxC){maxC=confidences[i];maxIdx=i}}
  return{inst:INSTRUMENTS[maxIdx],conf:maxC,scores}
}

// ==================== RENDER ====================
function renderSpectrum(){
  if(!isRec)return;
  const bufLen=analyser.frequencyBinCount;const freqData=new Uint8Array(bufLen);analyser.getByteFrequencyData(freqData);
  const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);
  // Draw spectrum bars
  const bw=W/bufLen;const features=getFeatures();const match=matchInstrument(features);
  for(let i=0;i<bufLen;i++){const x=i*bw,h=freqData[i]/255*H*.8;const freq=i*aCtx.sampleRate/analyser.fftSize;
    // Color by frequency
    const hue=(freq/2000)*300%360;ctx.fillStyle=`hsla(${hue},70%,50%,0.7)`;ctx.fillRect(x,H-h,bw,h)}
  // Highlight current instrument's color zone
  if(match&&match.conf>.3){const inst=match.inst;const startF=Math.max(0,inst.centroid-400);const endF=inst.rolloff;
    const sx=(startF/(aCtx.sampleRate/2))*W,ex=(endF/(aCtx.sampleRate/2))*W;
    ctx.fillStyle=inst.color+"22";ctx.fillRect(sx,0,ex-sx,H);ctx.strokeStyle=inst.color+"88";ctx.lineWidth=2;
    ctx.strokeRect(sx,0,ex-sx,H)}
  // Update UI
  updateUI(match);animId=requestAnimationFrame(renderSpectrum)}

function updateUI(match){
  if(!match||match.conf<.2){document.getElementById("inst-name").textContent="--";document.getElementById("inst-conf").textContent="🎵 等待演奏...";document.getElementById("inst-color").style.width="0";updateGrid([]);return}
  const inst=match.inst;document.getElementById("inst-name").textContent=inst.emoji+" "+inst.name;
  document.getElementById("inst-conf").textContent=`置信度 ${(match.conf*100).toFixed(0)}%`;
  document.getElementById("inst-color").style.background=inst.color;
  document.getElementById("inst-color").style.width=(match.conf*100)+"%";
  // Update grid
  const tops=match.scores.map((s,i)=>({idx:i,score:s})).sort((a,b)=>b.score-a.score).slice(0,3).map(s=>s.idx);
  updateGrid(tops)
}

function updateGrid(tops){
  const cards=document.querySelectorAll(".inst-card");
  cards.forEach((c,i)=>{
    c.classList.toggle("active",tops.includes(i));
    if(tops.includes(i))c.style.setProperty("--glow",INSTRUMENTS[i].color+"66");
    const bar=c.querySelector(".bar");if(bar)bar.style.width=(confidences[i]*100)+"%";bar.style.background=INSTRUMENTS[i].color
  })}

function buildGrid(){
  const grid=document.getElementById("inst-grid");grid.innerHTML="";
  INSTRUMENTS.forEach((inst,i)=>{
    const card=document.createElement("div");card.className="inst-card";
    card.innerHTML=`<span class="emoji">${inst.emoji}</span><span class="name">${inst.name}</span><div class="bar" style="width:0;background:${inst.color}"></div>`;
    grid.appendChild(card)})}

// Init
resize();
</script>
</body>
</html>
